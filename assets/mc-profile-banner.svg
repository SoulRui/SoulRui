<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">SoulRui · MC Software</title>
  <desc id="desc">MC Software profile banner: Windows, GIS, drone, image and file tools. Local processing and privacy first.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <clipPath id="avatar-clip">
      <rect x="96" y="150" width="180" height="180" rx="40"/>
    </clipPath>
  </defs>
  <rect width="1600" height="480" rx="36" fill="url(#background)"/>
  <circle cx="1430" cy="360" r="300" fill="#FFFFFF" opacity="0.035"/>
  <text x="1120" y="390" fill="#FFFFFF" opacity="0.045" font-family="Segoe UI, Arial, sans-serif" font-size="300" font-weight="700">MC</text>
  <rect x="96" y="74" width="88" height="8" rx="4" fill="#2563EB"/>
  <text x="204" y="86" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3">MC SOFTWARE</text>
  <image href="creator-avatar.png" x="96" y="150" width="180" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)"/>
  <rect x="96" y="150" width="180" height="180" rx="40" fill="none" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="4"/>
  <text x="340" y="190" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700">SoulRui</text>
  <text x="344" y="254" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600">WINDOWS · GIS · DRONE · IMAGE · FILE</text>
  <text x="344" y="326" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="34">实用工具 · 本地处理 · 隐私优先</text>
  <text x="344" y="384" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="26">Practical tools. Local processing. Privacy first.</text>
</svg>
